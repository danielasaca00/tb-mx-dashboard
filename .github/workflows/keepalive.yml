name: Keep Alive

on:
  schedule:
    - cron: '0 */6 * * *'  # cada 6 horas
  workflow_dispatch:        # permite correrlo manualmente también

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SVG-TB-MX
        run: curl -s -o /dev/null -w "%{http_code}" https://svg-tb-mx.streamlit.app
